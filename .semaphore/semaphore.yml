version: v1.0
name: CI/CD Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: "Core Business Flow"
    task:
      secrets:
        - name: 2doparcial-secrets
      jobs:
        - name: "Traceability and Contract Audit"
          commands:
            - checkout
            - chmod +x ci/*.sh
            - './ci/notify_trello.sh "$TRELLO_PROCESSING_LIST_ID" "Build started - Commit $SEMAPHORE_GIT_SHA"'
            - ./ci/run_spec_kit.sh
      
      epilogue:
        on_fail:
          commands:
            - echo "Initiating AI analysis and failure alerts..."
            - ./ci/analyze_failure.sh
        on_pass:
          commands:
            - echo "Contract fulfilled. Simulating success step..."
            - './ci/notify_trello.sh "$TRELLO_COMPLETED_LIST_ID" "Build successful - Contract verified"'
            - './ci/notify_telegram.sh "Build successful - Contract verified for commit $SEMAPHORE_GIT_SHA"'
            
  - name: "Docker Build Validation"
    task:
      jobs:
        - name: "Build Image"
          commands:
            - checkout
            - echo "Iniciando compilacion del contenedor..."
            - docker build -t parcial-web .
            - echo "Contenedor compilado con exito."