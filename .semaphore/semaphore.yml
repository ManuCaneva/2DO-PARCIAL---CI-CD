version: v1.0
name: CI/CD Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: "Core Business Flow"
    task:
      secrets:
        - name: 2doparcial-secrets
      jobs:
        - name: "Traceability and Contract Audit"
          commands:
            - checkout
            - chmod +x ci/*.sh
            - './ci/notify_trello.sh "$TRELLO_PROCESSING_LIST_ID" "🔄 [BUILD STARTED]%0A%0A  Status : Processing%0A%0A  • Commit: $SEMAPHORE_GIT_SHA"'
            - ./ci/run_contract_test.sh
      
      epilogue:
        on_fail:
          commands:
            - echo "Initiating AI analysis and failure alerts..."
            - ./ci/analyze_failure.sh
        on_pass:
          commands:
            - echo "Contract fulfilled. Simulating success step..."
            - './ci/notify_trello.sh "$TRELLO_COMPLETED_LIST_ID" "✅ [BUILD OK]%0A%0A  Result : Contract verified ✔️%0A%0A  • Commit: $SEMAPHORE_GIT_SHA"'
            - './ci/notify_telegram.sh " <b>[BUILD OK]</b>%0A%0A  <b>Result</b> : Contract verified ✔️%0A%0A  • <b>Commit</b>: <code>$SEMAPHORE_GIT_SHA</code>"'

  - name: "Code Quality Inspection"
    task:
      secrets:
        - name: 2doparcial-secrets
      jobs:
        - name: "SonarCloud Analysis"
          commands:
            - checkout
            - wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
            - unzip -q sonar-scanner-cli-8.1.0.6389-linux-x64.zip
            - ./sonar-scanner-8.1.0.6389-linux-x64/bin/sonar-scanner

  - name: "Docker Build Validation"
    task:
      jobs:
        - name: "Build Image"
          commands:
            - checkout
            - echo "Iniciando compilacion del contenedor..."
            - docker build -t parcial-web .
            - echo "Contenedor compilado con exito."