<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MINOLI — CI/CD Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#010102;--text:#f7f8f8;--text-muted:#8a8f98;--text-secondary:#d0d6e0;--text-tertiary:#62666d;--card-bg:#131518;--card-border:#23252a;--accent:#5e6ad2;--accent-rgb:94,106,210;--success:#27a644;--success-rgb:39,166,68;--footer-dot:#23252a;--particle-r:247;--particle-g:248;--particle-b:248}
[data-theme="light"]{--bg:#f5f5f7;--text:#1d1d1f;--text-muted:#6e6e73;--text-secondary:#4a4a4c;--text-tertiary:#86868b;--card-bg:#ffffff;--card-border:#e0e0e0;--footer-dot:#c0c0c0;--particle-r:29;--particle-g:29;--particle-b:31}
::selection{background:rgba(var(--accent-rgb),.3);color:var(--text)}
body{
  font-family:Inter,-apple-system,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale
}
#particles-canvas{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:0;pointer-events:none
}
#root{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;
  width:100%;max-width:1280px;
  margin:0 auto;padding:2rem;
  text-align:center
}
.hero-title{
  font-size:clamp(3.5rem,10vw,7rem);
  font-weight:600;letter-spacing:-.04em;
  color:var(--text);line-height:1.05;
  cursor:default;
  opacity:0;transform:translateY(40px);
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .15s forwards;
  transition:text-shadow .5s ease
}
.hero-title:hover{
  text-shadow:0 0 80px rgba(var(--accent-rgb),.15),0 0 160px rgba(var(--accent-rgb),.08)
}
.hero-subtitle{
  font-size:clamp(.95rem,1.6vw,1.15rem);
  font-weight:400;letter-spacing:-.01em;
  color:var(--text-muted);line-height:1.5;
  margin-top:1rem;max-width:560px;
  opacity:0;transform:translateY(30px);
  animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .35s forwards
}
.divider{
  width:80px;height:1px;
  background:var(--card-border);
  margin:2.5rem 0;
  opacity:0;animation:fadeIn .8s ease .6s forwards
}
.status-card{
  display:flex;align-items:center;
  gap:.75rem;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:12px;
  padding:1rem 1.5rem;
  opacity:0;transform:translateY(20px);
  animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .8s forwards;
  transition:border-color .3s ease,box-shadow .3s ease;
  cursor:default
}
.status-card:hover{
  border-color:var(--accent);
  box-shadow:0 0 30px rgba(var(--accent-rgb),.08)
}
.status-dot{
  width:8px;height:8px;min-width:8px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 8px rgba(var(--success-rgb),.4);
  animation:pulse 2.5s ease-in-out infinite
}
.status-text{
  font-size:.875rem;font-weight:400;
  color:var(--text-secondary);line-height:1.5;
  letter-spacing:-.01em
}
.footer-info{
  display:flex;align-items:center;gap:.5rem;
  margin-top:3rem;
  font-size:.75rem;font-weight:400;
  color:var(--text-tertiary);letter-spacing:0;
  opacity:0;animation:fadeIn .8s ease 1.1s forwards
}
.footer-dot{color:var(--footer-dot)}
#theme-toggle{
  position:fixed;top:1.5rem;right:1.5rem;z-index:10;
  width:40px;height:40px;border-radius:50%;
  border:1px solid var(--card-border);
  background:var(--card-bg);color:var(--text);
  cursor:pointer;display:grid;place-items:center;
  transition:background .3s,border-color .3s;
  opacity:0;animation:fadeIn .8s ease 1.1s forwards
}
#theme-toggle::before{content:"\263E";font-size:1.25rem;line-height:1}
[data-theme="light"] #theme-toggle::before{content:"\2600"}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(.85)}
}
@media(max-width:768px){
  .hero-title{font-size:clamp(2.5rem,14vw,3.5rem)}
  .hero-subtitle{font-size:.9rem}
  .status-card{padding:.75rem 1rem}
}
@media(max-width:480px){
  .hero-title{font-size:clamp(2rem,16vw,2.5rem)}
  .status-text{font-size:.8rem}
  .divider{width:60px;margin:2rem 0}
}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
'use strict';
const canvas=document.getElementById('particles-canvas');
const ctx=canvas.getContext('2d');
let particles=[];
const COUNT=60;
let pr=247,pg=248,pb=248;
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
function createParticles(){
  particles=Array.from({length:COUNT},()=>({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height,
    size:Math.random()*1.5+.3,
    speedY:-(Math.random()*.25+.05),speedX:(Math.random()-.5)*.08,
    opacity:Math.random()*.4+.1
  }))
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=`rgba(${pr},${pg},${pb},${p.opacity})`;ctx.fill();
    p.y+=p.speedY;p.x+=p.speedX;
    if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width}
    if(p.x<-10)p.x=canvas.width+10;if(p.x>canvas.width+10)p.x=-10
  }
  requestAnimationFrame(animate)
}
window.addEventListener('resize',()=>{resize();createParticles()});
resize();createParticles();animate();
document.getElementById('root').innerHTML=`
<div class="hero">
  <h1 class="hero-title">MINOLI</h1>
  <p class="hero-subtitle">Continuous Integration · Continuous Delivery</p>
  <div class="divider"></div>
  <div class="status-card">
    <div class="status-dot"></div>
    <span class="status-text">Pipeline operational · All checks passing</span>
  </div>
  <div class="footer-info">
    <span>GOYA</span><span class="footer-dot">·</span>
    <span>Semaphore CI/CD</span><span class="footer-dot">·</span>
    <span>v2.0.0</span>
  </div>
</div>`;
const toggle=document.createElement('button');
toggle.id='theme-toggle';
toggle.setAttribute('aria-label','Toggle theme');
document.body.appendChild(toggle);
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  if(theme==='light'){pr=29;pg=29;pb=31}else{pr=247;pg=248;pb=248}
}
const saved=localStorage.getItem('theme')||'dark';
applyTheme(saved);
toggle.addEventListener('click',function(){
  const cur=document.documentElement.getAttribute('data-theme');
  applyTheme(cur==='dark'?'light':'dark');
  localStorage.setItem('theme',document.documentElement.getAttribute('data-theme'));
});
});
</script>
</head>
<body>
<span aria-hidden="true" style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">MINOLI</span>
<canvas id="particles-canvas" aria-hidden="true"></canvas>
<div id="root"></div>
</body>
</html>
