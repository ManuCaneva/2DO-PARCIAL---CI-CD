<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MINOLI — CI/CD Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(94,106,210,.3);color:#f7f8f8}
body{
  font-family:Inter,-apple-system,system-ui,sans-serif;
  background:#010102;
  color:#f7f8f8;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale
}
#particles-canvas{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  z-index:0;pointer-events:none
}
#root{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;
  width:100%;max-width:1280px;
  margin:0 auto;padding:2rem;
  text-align:center
}
.hero-title{
  font-size:clamp(3.5rem,10vw,7rem);
  font-weight:600;letter-spacing:-.04em;
  color:#f7f8f8;line-height:1.05;
  cursor:default;
  opacity:0;transform:translateY(40px);
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .15s forwards;
  transition:text-shadow .5s ease
}
.hero-title:hover{
  text-shadow:0 0 80px rgba(94,106,210,.15),0 0 160px rgba(94,106,210,.08)
}
.hero-subtitle{
  font-size:clamp(.95rem,1.6vw,1.15rem);
  font-weight:400;letter-spacing:-.01em;
  color:#8a8f98;line-height:1.5;
  margin-top:1rem;max-width:560px;
  opacity:0;transform:translateY(30px);
  animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .35s forwards
}
.divider{
  width:80px;height:1px;
  background:#23252a;
  margin:2.5rem 0;
  opacity:0;animation:fadeIn .8s ease .6s forwards
}
.status-card{
  display:flex;align-items:center;
  gap:.75rem;
  background:#131518;
  border:1px solid #23252a;
  border-radius:12px;
  padding:1rem 1.5rem;
  opacity:0;transform:translateY(20px);
  animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .8s forwards;
  transition:border-color .3s ease,box-shadow .3s ease;
  cursor:default
}
.status-card:hover{
  border-color:#5e6ad2;
  box-shadow:0 0 30px rgba(94,106,210,.08)
}
.status-dot{
  width:8px;height:8px;min-width:8px;
  border-radius:50%;
  background:#27a644;
  box-shadow:0 0 8px rgba(39,166,68,.4);
  animation:pulse 2.5s ease-in-out infinite
}
.status-text{
  font-size:.875rem;font-weight:400;
  color:#d0d6e0;line-height:1.5;
  letter-spacing:-.01em
}
.footer-info{
  display:flex;align-items:center;gap:.5rem;
  margin-top:3rem;
  font-size:.75rem;font-weight:400;
  color:#62666d;letter-spacing:0;
  opacity:0;animation:fadeIn .8s ease 1.1s forwards
}
.footer-dot{color:#23252a}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(.85)}
}
@media(max-width:768px){
  .hero-title{font-size:clamp(2.5rem,14vw,3.5rem)}
  .hero-subtitle{font-size:.9rem}
  .status-card{padding:.75rem 1rem}
}
@media(max-width:480px){
  .hero-title{font-size:clamp(2rem,16vw,2.5rem)}
  .status-text{font-size:.8rem}
  .divider{width:60px;margin:2rem 0}
}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
'use strict';
const canvas=document.getElementById('particles-canvas');
const ctx=canvas.getContext('2d');
let particles=[];
const COUNT=60;
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
function createParticles(){
  particles=Array.from({length:COUNT},()=>({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height,
    size:Math.random()*1.5+.3,
    speedY:-(Math.random()*.25+.05),speedX:(Math.random()-.5)*.08,
    opacity:Math.random()*.4+.1
  }))
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(const p of particles){
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=`rgba(247,248,248,${p.opacity})`;ctx.fill();
    p.y+=p.speedY;p.x+=p.speedX;
    if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width}
    if(p.x<-10)p.x=canvas.width+10;if(p.x>canvas.width+10)p.x=-10
  }
  requestAnimationFrame(animate)
}
window.addEventListener('resize',()=>{resize();createParticles()});
resize();createParticles();animate();
document.getElementById('root').innerHTML=`
<div class="hero">
  <h1 class="hero-title">MINOLI</h1>
  <p class="hero-subtitle">Continuous Integration · Continuous Delivery</p>
  <div class="divider"></div>
  <div class="status-card">
    <div class="status-dot"></div>
    <span class="status-text">Pipeline operational · All checks passing</span>
  </div>
  <div class="footer-info">
    <span>SDD Verified</span><span class="footer-dot">·</span>
    <span>Semaphore CI/CD</span><span class="footer-dot">·</span>
    <span>v2.0.0</span>
  </div>
</div>`;
});
</script>
</head>
<body>
<span aria-hidden="true" style="position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">MINOLI</span>
<canvas id="particles-canvas" aria-hidden="true"></canvas>
<div id="root"></div>
</body>
</html>
